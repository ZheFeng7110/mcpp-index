name: diag-ut-macos

on:
  push:
    branches: [add-boost-ext-ut]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download mcpp 0.0.109
        shell: bash
        env:
          MCPP_ARCHIVE: mcpp-0.0.109-macosx-arm64.tar.gz
          MCPP_ROOT: mcpp-0.0.109-macosx-arm64
        run: |
          curl -L -fsS -o "$MCPP_ARCHIVE" \
            "https://github.com/mcpp-community/mcpp/releases/download/v0.0.109/${MCPP_ARCHIVE}"
          tar -xzf "$MCPP_ARCHIVE"
          root="$PWD/$MCPP_ROOT"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$root/registry/bin/xlings" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: mcpp test + forensics
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          "$MCPP" --version
          "$MCPP" test -p boost-ext.ut || true
          dir=tests/examples/boost-ext.ut/target/aarch64-macos
          d=$(ls -d $dir/*/ | head -1)
          echo "TARGETDIR=$d"
          bin="$d/bin/ut"
          echo "=== init sections ==="
          otool -l "$bin" | grep -iE "sectname" | grep -iE "init|mod" || echo "(none)"
          echo "=== __TEXT,__init_offsets content ==="
          otool -s __TEXT __init_offsets "$bin" 2>&1 | head -20
          echo "=== __DATA,__mod_init_func content ==="
          otool -s __DATA __mod_init_func "$bin" 2>&1 | head -20
          echo "=== DoIOSInit / start_std_streams in binary? ==="
          nm -nm "$bin" 2>/dev/null | grep -iE "DoIOS|start_std" || echo "(NOT PRESENT)"
          echo "=== iostream.o symbols in binary (cin/cerr/clog)? ==="
          nm -nm "$bin" 2>/dev/null | grep -iE "4cinE|4cerrE|4clogE" || echo "(NOT PRESENT)"
          echo "=== ios_base::Init ctor in binary? ==="
          nm -nm "$bin" 2>/dev/null | grep -iE "ios_base4InitC1|ios_base4InitC2" || echo "(NOT PRESENT)"
      - name: relink real objects with different policies
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          clang=$(python3 -c "import json;print(json.load(open('tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'][0])")
          pkgroot=$(dirname $(dirname $clang))
          dir=tests/examples/boost-ext.ut/target/aarch64-macos
          d=$(ls -d $dir/*/ | head -1)
          cd "$d"
          C="$clang -nostdinc++ -isystem $pkgroot/include/c++/v1 --sysroot=$(xcrun --show-sdk-path) -mmacosx-version-min=14.0"
          echo "=== E: dynamic system libc++ (default link) ==="
          $C -o ut_e obj/ut.o obj/boost.ut.m.o 2>&1 | tail -3
          otool -L ut_e 2>/dev/null | grep -i c++ || true
          ./ut_e; echo "E exit: $?"
          echo "=== F: static libc++.a (plain) ==="
          $C -o ut_f obj/ut.o obj/boost.ut.m.o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -3
          otool -L ut_f 2>/dev/null | grep -i c++ || echo "(no libc++ dylib)"
          ./ut_f; echo "F exit: $?"
          echo "=== G: static libc++.a + -no_dead_strip ==="
          $C -o ut_g obj/ut.o obj/boost.ut.m.o -Wl,-no_dead_strip "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -3
          ./ut_g; echo "G exit: $?"
          echo "=== H: static libc++.a + -dead_strip (explicit) ==="
          $C -o ut_h obj/ut.o obj/boost.ut.m.o -Wl,-dead_strip "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -3
          ./ut_h; echo "H exit: $?"
          echo "=== I: static libc++.a + force_load iostream object ==="
          tmp=$(mktemp -d)
          (cd "$tmp" && ar -x "$pkgroot/lib/libc++.a" iostream.cpp.o 2>/dev/null; ls)
          $C -o ut_i obj/ut.o obj/boost.ut.m.o "$tmp/iostream.cpp.o" "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -3
          ./ut_i; echo "I exit: $?"
          echo "=== init_offsets in G (no_dead_strip) vs F (plain) ==="
          echo "--- F:"; otool -l ut_f | grep -iE "init_offsets|mod_init" || echo none
          echo "--- G:"; otool -l ut_g | grep -iE "init_offsets|mod_init" || echo none
          echo "--- G DoIOSInit:"; nm -nm ut_g | grep -iE "DoIOS|start_std" || echo "(NOT PRESENT)"
          echo "=== DYLD_PRINT_BINDINGS on F (cout binding) ==="
          DYLD_PRINT_BINDINGS=1 ./ut_f 2>&1 | grep -i "cout" | head -5 || true
