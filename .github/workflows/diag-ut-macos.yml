name: diag-ut-macos

on:
  push:
    branches: [add-boost-ext-ut]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download mcpp 0.0.109
        shell: bash
        env:
          MCPP_ARCHIVE: mcpp-0.0.109-macosx-arm64.tar.gz
          MCPP_ROOT: mcpp-0.0.109-macosx-arm64
        run: |
          curl -L -fsS -o "$MCPP_ARCHIVE" \
            "https://github.com/mcpp-community/mcpp/releases/download/v0.0.109/${MCPP_ARCHIVE}"
          tar -xzf "$MCPP_ARCHIVE"
          root="$PWD/$MCPP_ROOT"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$root/registry/bin/xlings" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: mcpp test (collect crash)
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          "$MCPP" --version
          "$MCPP" test -p boost-ext.ut || true
          bin=$(find tests/examples/boost-ext.ut/target -name 'ut' -type f | head -1)
          echo "BIN=$bin"
          echo "=== init_offsets entries (raw) ==="
          otool -s __TEXT __init_offsets "$bin" 2>/dev/null || true
          echo "=== symbolize __init_offsets (ASLR off) ==="
          offs=$(otool -s __TEXT __init_offsets "$bin" 2>/dev/null | awk 'NR>2 {for(i=1;i<=NF;i++) if ($i ~ /^[0-9a-f]{8}$/) print $i}')
          printf 'settings set target.disable-aslr true\nrun\n' > /tmp/x.lldb
          for off in $offs; do
            addr=$((16#$off))
            printf 'image lookup -a 0x%x\n' $((0x100000000 + addr)) >> /tmp/x.lldb
          done
          lldb -b -s /tmp/x.lldb -- "$bin" 2>&1 | grep -E "image lookup -a|Summary:|Function:" | head -80 || true
      - name: relink matrix + guard test
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          clang=$(python3 -c "import json;print(json.load(open('tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'][0])")
          pkgroot=$(dirname $(dirname $clang))
          d=$(ls -d "$GITHUB_WORKSPACE/tests/examples/boost-ext.ut/target/aarch64-macos"/*/ | head -1)
          cd "$d"
          C="$clang -nostdinc++ -isystem $pkgroot/include/c++/v1 --sysroot=$(xcrun --show-sdk-path) -mmacosx-version-min=14.0"
          stdpcm=$(ls pcm.cache/std.pcm 2>/dev/null)
          cppm=$(find "$GITHUB_WORKSPACE/tests/examples/boost-ext.ut" -path '*generated*/boost.ut.cppm' | head -1)
          echo "CPPM=$cppm STD=$stdpcm"
          runit() { if ./"$1" >/tmp/out.txt 2>&1; then echo "$2 exit: 0 :: $(head -1 /tmp/out.txt)"; else echo "$2 exit: $? :: $(head -1 /tmp/out.txt)"; fi; }
          $C -o ut_f obj/ut.o obj/boost.ut.m.o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -2 || true
          runit ut_f "F(static plain)"
          $C -o ut_g obj/ut.o obj/boost.ut.m.o -Wl,-no_dead_strip "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -2 || true
          runit ut_g "G(no_dead_strip)"
          $C -o ut_d obj/ut.o obj/boost.ut.m.o -Wl,-dead_strip "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -2 || true
          runit ut_d "D(dead_strip explicit)"
          $C -o ut_m obj/ut.o obj/boost.ut.m.o -L"$pkgroot/lib" -lc++ -lc++abi 2>&1 | tail -2 || true
          otool -L ut_m 2>/dev/null | grep -i c++ || true
          runit ut_m "M(xpkg dylib)"
          tmp=$(mktemp -d)
          (cd "$tmp" && ar -t "$pkgroot/lib/libc++.a" | grep -i iostream && ar -x "$pkgroot/lib/libc++.a" $(ar -t "$pkgroot/lib/libc++.a" | grep -i iostream) 2>/dev/null) || true
          ls "$tmp" || true
          $C -o ut_i obj/ut.o obj/boost.ut.m.o "$tmp"/*.o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -2 || true
          runit ut_i "I(force iostream.o)"
          echo "=== K2: cppm GMF-guard (external linkage, before export module), static link ==="
          inc=$(python3 -c "import json;args=json.load(open('$GITHUB_WORKSPACE/tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'];print(' '.join(a for a in args if a.startswith('-I')))")
          echo "INC=$inc"
          cp "$cppm" /tmp/guarded2.cppm
          python3 -c "p='/tmp/guarded2.cppm'; s=open(p).read(); g='\n// GMF guard: force libc++ stream construction before ut cfg (static-libc++ init-order workaround)\nstd::ios_base::Init ut_ensure_std_streams_ready_global;\n'; m='export module boost.ut;'; assert m in s; open(p,'w').write(s.replace(m, g+m)); print('gmf guard injected')"
          $C -std=c++23 -fmodule-file=std=$stdpcm -fmodule-file=std.compat=pcm.cache/std.compat.pcm -fprebuilt-module-path=pcm.cache -O0 -g --no-default-config -Wno-template-body $inc -c /tmp/guarded2.cppm -o obj/guarded2.m.o 2>&1 | tail -10 || true
          $C -o ut_k2 obj/ut.o obj/guarded2.m.o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -5 || true
          runit ut_k2 "K2(GMF guard static plain)"
          $C -o ut_k3 obj/ut.o obj/guarded2.m.o 2>&1 | tail -5 || true
          runit ut_k3 "K3(GMF guard dylib)"
          echo "=== K2 init_offsets symbolization ==="
          offs=$(otool -s __TEXT __init_offsets ut_k2 2>/dev/null | awk 'NR>2 {for(i=1;i<=NF;i++) if ($i ~ /^[0-9a-f]{8}$/) print $i}')
          printf 'settings set target.disable-aslr true\nrun\n' > /tmp/y.lldb
          for off in $offs; do addr=$((16#$off)); printf 'image lookup -a 0x%x\n' $((0x100000000 + addr)) >> /tmp/y.lldb; done
          lldb -b -s /tmp/y.lldb -- ./ut_k2 2>&1 | grep -E "image lookup -a|Summary:|Function:" | head -80 || true
          echo "=== K2 guard init (.97) disasm ==="
          printf 'settings set target.disable-aslr true\nrun\n' > /tmp/w.lldb
          printf 'image lookup -a 0x%x\ndisassemble -s 0x%x -c 30\n' 0x0 0x0 >> /tmp/w.lldb
          offs=$(otool -s __TEXT __init_offsets ut_k2 2>/dev/null | awk 'NR>2 {for(i=1;i<=NF;i++) if ($i ~ /^[0-9a-f]{8}$/) print $i}')
          i=0
          for off in $offs; do
            i=$((i+1))
            if [ $i -eq 3 ]; then printf 'disassemble -s 0x%x -c 30\n' $((0x100000000 + 16#$off)) >> /tmp/w.lldb; fi
          done
          lldb -b -s /tmp/w.lldb -- ./ut_k2 2>&1 | grep -E "ut_k2\`|bl |0x100" | head -40 || true
          echo "=== S: __attribute__((constructor)) fn in GMF, static link ==="
          cp "$cppm" /tmp/guarded3.cppm
          python3 -c "p='/tmp/guarded3.cppm'; s=open(p).read(); g='\n// GMF ctor: force libc++ stream construction before ut cfg\n__attribute__((constructor)) static void ut_force_ios_init() { std::ios_base::Init i; }\n'; m='export module boost.ut;'; assert m in s; open(p,'w').write(s.replace(m, g+m)); print('ctor injected')"
          $C -std=c++23 -fmodule-file=std=$stdpcm -fmodule-file=std.compat=pcm.cache/std.compat.pcm -fprebuilt-module-path=pcm.cache -O0 -g --no-default-config -Wno-template-body $inc -c /tmp/guarded3.cppm -o obj/guarded3.m.o 2>&1 | tail -6 || true
          $C -o ut_s obj/ut.o obj/guarded3.m.o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -4 || true
          runit ut_s "S(GMF ctor static)"
          echo "=== STREAMTEST: plain TU + ios_base::Init guard, static libc++ ==="
          printf '#include <iostream>\nstatic std::ios_base::Init g_ios;\nint main() { return std::cout.rdbuf() != nullptr ? 0 : 1; }\n' > /tmp/streamtest.cpp
          $C -O0 -g -c /tmp/streamtest.cpp -o /tmp/streamtest.o 2>&1 | tail -3 || true
          $C -o /tmp/streamtest /tmp/streamtest.o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -3 || true
          if /tmp/streamtest >/tmp/st.out 2>&1; then echo "streamtest exit: 0 (guard WORKS in plain TU)"; else echo "streamtest exit: $? (guard FAILS in plain TU)"; fi
          echo "  streamtest DoIOSInit present?"; nm -nm /tmp/streamtest 2>/dev/null | grep -iE "DoIOS|start_std" || echo "  (NOT PRESENT)"
          echo "=== .97 disasm (fixed) ==="
          offs=$(otool -s __TEXT __init_offsets ut_k2 2>/dev/null | awk 'NR>2 {for(i=1;i<=NF;i++) if ($i ~ /^[0-9a-f]{8}$/) print $i}')
          printf 'settings set target.disable-aslr true\nrun\n' > /tmp/w.lldb
          i=0
          for off in $offs; do
            i=$((i+1))
            if [ $i -eq 3 ]; then printf 'disassemble -s 0x%x -c 25\n' $((0x100000000 + 16#$off)) >> /tmp/w.lldb; fi
          done
          lldb -b -s /tmp/w.lldb -- ./ut_k2 2>&1 | sed -n '/disassemble/,$p' | head -35 || true
          echo "=== mcpp link command (verbose full) ==="
          "$MCPP" test -p boost-ext.ut -v 2>&1 | grep -iE "clang\+\+|ld |-o |libc\+\+" | head -15 || true
          echo "=== M3: system dylib ONLY via mcpp-style link (sanity: E variant) ==="
          $C -o ut_e2 obj/ut.o obj/boost.ut.m.o 2>&1 | tail -3 || true
          runit ut_e2 "E2(dylib only)"
          echo "=== O: libc++.a BEFORE user objects ==="
          $C -o ut_o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" obj/ut.o obj/boost.ut.m.o 2>&1 | tail -5 || true
          runit ut_o "O(archive first)"
          echo "=== P: force_load libc++.a ==="
          $C -o ut_p obj/ut.o obj/boost.ut.m.o -Wl,-force_load,"$pkgroot/lib/libc++.a" -Wl,-force_load,"$pkgroot/lib/libc++abi.a" 2>&1 | tail -5 || true
          runit ut_p "P(force_load)"
          echo "=== M2: xpkg dylib + rpath ==="
          $C -o ut_m2 obj/ut.o obj/boost.ut.m.o -L"$pkgroot/lib" -lc++ -lc++abi -Wl,-rpath,"$pkgroot/lib" 2>&1 | tail -5 || true
          runit ut_m2 "M2(xpkg dylib+rpath)"
          echo "=== K backtrace + guard disasm ==="
          printf 'settings set target.disable-aslr true\nrun\nbt\nregister read pc x0 x1\n' > /tmp/z.lldb
          lldb -b -s /tmp/z.lldb -- ./ut_k 2>&1 | tail -45 || true
          echo "=== K guard init disasm (0x100020534 = first guarded.cppm init) ==="
          printf 'settings set target.disable-aslr true\nrun\ndisassemble -s 0x100020534 -c 25\n' > /tmp/w.lldb
          lldb -b -s /tmp/w.lldb -- ./ut_k 2>&1 | tail -40 || true
          echo "=== O runtime init order ==="
          DYLD_PRINT_INITIALIZERS=1 ./ut_o 2>&1 | grep -v "^dyld\[" | head -8 || true
          DYLD_PRINT_INITIALIZERS=1 ./ut_o 2>&1 | grep "^dyld\[" | head -40 || true
          echo "=== O abort backtrace ==="
          printf 'settings set target.disable-aslr true\nrun\nbt all\n' > /tmp/v.lldb
          lldb -b -s /tmp/v.lldb -- ./ut_o 2>&1 | tail -50 || true
