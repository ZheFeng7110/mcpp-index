name: diag-ut-macos

on:
  push:
    branches: [fix-ut-macos-ci]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download mcpp 0.0.109
        shell: bash
        env:
          MCPP_ARCHIVE: mcpp-0.0.109-macosx-arm64.tar.gz
          MCPP_ROOT: mcpp-0.0.109-macosx-arm64
        run: |
          curl -L -fsS -o "$MCPP_ARCHIVE" \
            "https://github.com/mcpp-community/mcpp/releases/download/v0.0.109/${MCPP_ARCHIVE}"
          tar -xzf "$MCPP_ARCHIVE"
          root="$PWD/$MCPP_ROOT"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$root/registry/bin/xlings" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: mcpp test (collect crash)
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          "$MCPP" --version
          "$MCPP" test -p boost-ext.ut || true
          bin=$(find tests/examples/boost-ext.ut/target -name 'ut' -type f | head -1)
          echo "BIN=$bin"
      - name: S5 .192 disasm — does it call DoIOSInit ctor?
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          set +e
          clang=$(python3 -c "import json;print(json.load(open('tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'][0])")
          pkgroot=$(dirname $(dirname $clang))
          d=$(ls -d tests/examples/boost-ext.ut/target/aarch64-macos/*/ | head -1)
          cd "$d"
          C="$clang -nostdinc++ -isystem $pkgroot/include/c++/v1 --sysroot=$(xcrun --show-sdk-path) -mmacosx-version-min=14.0"
          runit() { if ./"$1" >/tmp/out.txt 2>&1; then echo "$2 exit: 0 :: $(head -1 /tmp/out.txt)"; else echo "$2 exit: $? :: $(head -1 /tmp/out.txt)"; fi; }
          cppm=$(find "$GITHUB_WORKSPACE/tests/examples/boost-ext.ut" -path '*generated*/boost.ut.cppm' | head -1)
          cp "$cppm" /tmp/guarded8.cppm
          python3 -c "p='/tmp/guarded8.cppm'; s=open(p).read(); g='\n// S5: external DoIOSInit decl in GMF\nnamespace std { namespace __1 { class DoIOSInit { public: DoIOSInit(); }; } }\n'; m='export module boost.ut;'; assert m in s; s=s.replace(m, g+m); g2='\n// S5: purview inline DoIOSInit var (inline => initializer emitted, like cfg)\nnamespace ut_streams { inline std::__1::DoIOSInit ut_doios{}; }\n'; m2='#define BOOST_UT_CXX_MODULES 1'; assert m2 in s; s=s.replace(m2, g2+m2); open(p,'w').write(s); print('S5 injected')"
          inc=$(python3 -c "import json;args=json.load(open('$GITHUB_WORKSPACE/tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'];print(' '.join(a for a in args if a.startswith('-I')))")
          stdpcm=$(ls pcm.cache/std.pcm 2>/dev/null)
          $C -std=c++23 -fmodule-file=std=$stdpcm -fmodule-file=std.compat=pcm.cache/std.compat.pcm -fprebuilt-module-path=pcm.cache -O0 -g --no-default-config -Wno-template-body $inc -c /tmp/guarded8.cppm -o obj/guarded8.m.o 2>&1 | tail -6 || true
          $C -o ut_s5 obj/ut.o obj/guarded8.m.o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -4 || true
          runit ut_s5 "S5(inline DoIOSInit)"
          echo "=== DoIOSInit C1 binding in ut_s5 ==="
          nm -nm ut_s5 2>/dev/null | grep -iE "DoIOSInitC1|DoIOSInitC2" || echo "(NOT FOUND)"
          echo "=== ut_doios symbol ==="
          nm -nm ut_s5 2>/dev/null | grep -iE "ut_doios|ut_streams" | head -5 || echo "(NOT FOUND)"
          echo "=== .192 disasm (3rd init = ut_doios) ==="
          offs=$(otool -s __TEXT __init_offsets ut_s5 2>/dev/null | awk 'NR>2 {for(i=1;i<=NF;i++) if ($i ~ /^[0-9a-f]{8}$/) print $i}')
          echo "offsets: $offs"
          off=$(echo $offs | awk '{print $3}')
          echo "3rd offset: $off"
          printf 'settings set target.disable-aslr true\nrun\n' > /tmp/x.lldb
          printf 'disassemble -s 0x%x -c 30\n' $((0x100000000 + 16#$off)) >> /tmp/x.lldb
          lldb -b -s /tmp/x.lldb -- ./ut_s5 2>&1 | sed -n '/disassemble/,$p' | head -35 || true
          echo "=== nm: who defines _ZNSt3__19DoIOSInitC1Ev ==="
          nm -nm ut_s5 2>/dev/null | grep "_ZNSt3__19DoIOSInitC1Ev" || echo "(undefined or absent)"
          echo "=== nm -u: any undefined ==="
          nm -u ut_s5 2>/dev/null | head -10 || true
