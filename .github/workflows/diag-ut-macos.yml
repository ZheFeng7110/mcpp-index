name: diag-ut-macos

on:
  push:
    branches: [fix-ut-macos-ci]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download mcpp 0.0.109
        shell: bash
        env:
          MCPP_ARCHIVE: mcpp-0.0.109-macosx-arm64.tar.gz
          MCPP_ROOT: mcpp-0.0.109-macosx-arm64
        run: |
          curl -L -fsS -o "$MCPP_ARCHIVE" \
            "https://github.com/mcpp-community/mcpp/releases/download/v0.0.109/${MCPP_ARCHIVE}"
          tar -xzf "$MCPP_ARCHIVE"
          root="$PWD/$MCPP_ROOT"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$root/registry/bin/xlings" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: mcpp test (collect crash)
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          "$MCPP" --version
          "$MCPP" test -p boost-ext.ut || true
          bin=$(find tests/examples/boost-ext.ut/target -name 'ut' -type f | head -1)
          echo "BIN=$bin"
          echo "=== otool -L (static vs dylib) ==="
          otool -L "$bin" 2>/dev/null || true
      - name: S3 module-linkage DoIOSInit guard
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          clang=$(python3 -c "import json;print(json.load(open('tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'][0])")
          pkgroot=$(dirname $(dirname $clang))
          d=$(ls -d tests/examples/boost-ext.ut/target/aarch64-macos/*/ | head -1)
          cd "$d"
          C="$clang -nostdinc++ -isystem $pkgroot/include/c++/v1 --sysroot=$(xcrun --show-sdk-path) -mmacosx-version-min=14.0"
          runit() { if ./"$1" >/tmp/out.txt 2>&1; then echo "$2 exit: 0 :: $(head -1 /tmp/out.txt)"; else echo "$2 exit: $? :: $(head -1 /tmp/out.txt)"; fi; }
          set +e
          echo "=== S4: GMF DoIOSInit decl + purview INLINE force_init var ==="
          cppm=$(find "$GITHUB_WORKSPACE/tests/examples/boost-ext.ut" -path '*generated*/boost.ut.cppm' | head -1)
          cp "$cppm" /tmp/guarded7.cppm
          python3 -c "p='/tmp/guarded7.cppm'; s=open(p).read(); g='\n// S4: external DoIOSInit decl in GMF\nnamespace std { namespace __1 { class DoIOSInit { public: DoIOSInit(); }; } }\n'; m='export module boost.ut;'; assert m in s; s=s.replace(m, g+m); g2='\n// S4: purview inline guard var (inline => initializer emitted, like cfg)\nnamespace ut_streams {\nstruct [[maybe_unused]] force_init { force_init() { static std::__1::DoIOSInit i; } };\ninline force_init ut_force_ios_init{};\n}\n'; m2='#define BOOST_UT_CXX_MODULES 1'; assert m2 in s; s=s.replace(m2, g2+m2); open(p,'w').write(s); print('S4 injected')"
          inc=$(python3 -c "import json;args=json.load(open('$GITHUB_WORKSPACE/tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'];print(' '.join(a for a in args if a.startswith('-I')))")
          stdpcm=$(ls pcm.cache/std.pcm 2>/dev/null)
          $C -std=c++23 -fmodule-file=std=$stdpcm -fmodule-file=std.compat=pcm.cache/std.compat.pcm -fprebuilt-module-path=pcm.cache -O0 -g --no-default-config -Wno-template-body $inc -c /tmp/guarded7.cppm -o obj/guarded7.m.o 2>&1 | tail -8 || true
          $C -o ut_s4 obj/ut.o obj/guarded7.m.o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -4 || true
          runit ut_s4 "S4(inline force_init)"
          if [ -f ut_s4 ]; then
            echo "=== S4 init order ==="
            offs=$(otool -s __TEXT __init_offsets ut_s4 2>/dev/null | awk 'NR>2 {for(i=1;i<=NF;i++) if ($i ~ /^[0-9a-f]{8}$/) print $i}')
            printf 'settings set target.disable-aslr true\nrun\n' > /tmp/s4.lldb
            for off in $offs; do printf 'image lookup -a 0x%x\n' $((0x100000000 + 16#$off)) >> /tmp/s4.lldb; done
            lldb -b -s /tmp/s4.lldb -- ./ut_s4 2>&1 | grep -E "Summary:" | head -30 || true
            echo "=== S4 disasm of first guarded7 init ==="
            off=$(echo $offs | awk '{print $3}')
            printf 'settings set target.disable-aslr true\nrun\ndisassemble -s 0x%x -c 30\n' $((0x100000000 + 16#$off)) > /tmp/s4b.lldb
            lldb -b -s /tmp/s4b.lldb -- ./ut_s4 2>&1 | sed -n '/disassemble/,$p' | head -35 || true
          fi
