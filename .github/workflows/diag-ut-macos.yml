name: diag-ut-macos

on:
  push:
    branches: [fix-ut-macos-ci]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download mcpp 0.0.109
        shell: bash
        env:
          MCPP_ARCHIVE: mcpp-0.0.109-macosx-arm64.tar.gz
          MCPP_ROOT: mcpp-0.0.109-macosx-arm64
        run: |
          curl -L -fsS -o "$MCPP_ARCHIVE" \
            "https://github.com/mcpp-community/mcpp/releases/download/v0.0.109/${MCPP_ARCHIVE}"
          tar -xzf "$MCPP_ARCHIVE"
          root="$PWD/$MCPP_ROOT"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$root/registry/bin/xlings" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: mcpp test (collect crash)
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          "$MCPP" --version
          "$MCPP" test -p boost-ext.ut || true
          bin=$(find tests/examples/boost-ext.ut/target -name 'ut' -type f | head -1)
          echo "BIN=$bin"
          echo "=== otool -L (static vs dylib) ==="
          otool -L "$bin" 2>/dev/null || true
      - name: streamtest init disasm + S2 DoIOSInit ctor experiment
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          clang=$(python3 -c "import json;print(json.load(open('tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'][0])")
          pkgroot=$(dirname $(dirname $clang))
          d=$(ls -d tests/examples/boost-ext.ut/target/aarch64-macos/*/ | head -1)
          cd "$d"
          C="$clang -nostdinc++ -isystem $pkgroot/include/c++/v1 --sysroot=$(xcrun --show-sdk-path) -mmacosx-version-min=14.0"
          runit() { if ./"$1" >/tmp/out.txt 2>&1; then echo "$2 exit: 0 :: $(head -1 /tmp/out.txt)"; else echo "$2 exit: $? :: $(head -1 /tmp/out.txt)"; fi; }
          echo "=== build streamtest again for disasm ==="
          printf '#include <iostream>\nstatic std::ios_base::Init g_ios;\nint main() { return std::cout.rdbuf() != nullptr ? 0 : 1; }\n' > /tmp/streamtest.cpp
          $C -O0 -g -c /tmp/streamtest.cpp -o /tmp/streamtest.o 2>&1 | tail -2 || true
          $C -o /tmp/streamtest /tmp/streamtest.o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -2 || true
          runit /tmp/streamtest "ST(plain)"
          printf 'settings set target.disable-aslr true\nrun\nbt\n' > /tmp/s.lldb
          offs=$(otool -s __TEXT __init_offsets /tmp/streamtest 2>/dev/null | awk 'NR>2 {for(i=1;i<=NF;i++) if ($i ~ /^[0-9a-f]{8}$/) print $i}')
          echo "streamtest init offsets: $offs"
          i=0
          for off in $offs; do
            i=$((i+1))
            printf 'disassemble -s 0x%x -c 30\n' $((0x100000000 + 16#$off)) >> /tmp/s.lldb
          done
          lldb -b -s /tmp/s.lldb -- /tmp/streamtest 2>&1 | sed -n '/disassemble/,$p' | grep -E "0x100000|bl |->" | head -50 || true
          echo "=== S2: GMF ctor constructing std::__1::DoIOSInit directly ==="
          cppm=$(find "$GITHUB_WORKSPACE/tests/examples/boost-ext.ut" -path '*generated*/boost.ut.cppm' | head -1)
          cp "$cppm" /tmp/guarded4.cppm
          python3 -c "p='/tmp/guarded4.cppm'; s=open(p).read(); g='\n// S2: force libc++ stream construction via its internal DoIOSInit\nnamespace std { namespace __1 { class DoIOSInit { public: DoIOSInit(); }; } }\n__attribute__((constructor)) static void ut_force_ios_init() { static std::__1::DoIOSInit i; }\n'; m='export module boost.ut;'; assert m in s; open(p,'w').write(s.replace(m, g+m)); print('S2 injected')"
          inc=$(python3 -c "import json;args=json.load(open('$GITHUB_WORKSPACE/tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'];print(' '.join(a for a in args if a.startswith('-I')))")
          stdpcm=$(ls pcm.cache/std.pcm 2>/dev/null)
          $C -std=c++23 -fmodule-file=std=$stdpcm -fmodule-file=std.compat=pcm.cache/std.compat.pcm -fprebuilt-module-path=pcm.cache -O0 -g --no-default-config -Wno-template-body $inc -c /tmp/guarded4.cppm -o obj/guarded4.m.o 2>&1 | tail -6 || true
          $C -o ut_s2 obj/ut.o obj/guarded4.m.o "$pkgroot/lib/libc++.a" "$pkgroot/lib/libc++abi.a" 2>&1 | tail -4 || true
          runit ut_s2 "S2(DoIOSInit ctor)"
          if [ -f ut_s2 ]; then
            echo "=== S2 init order ==="
            offs=$(otool -s __TEXT __init_offsets ut_s2 2>/dev/null | awk 'NR>2 {for(i=1;i<=NF;i++) if ($i ~ /^[0-9a-f]{8}$/) print $i}')
            printf 'settings set target.disable-aslr true\nrun\n' > /tmp/s2.lldb
            for off in $offs; do printf 'image lookup -a 0x%x\n' $((0x100000000 + 16#$off)) >> /tmp/s2.lldb; done
            lldb -b -s /tmp/s2.lldb -- ./ut_s2 2>&1 | grep -E "Summary:" | head -30 || true
          fi
