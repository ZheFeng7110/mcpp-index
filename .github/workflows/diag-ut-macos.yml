name: diag-ut-macos

on:
  push:
    branches: [fix-ut-macos-ci]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download mcpp 0.0.109
        shell: bash
        env:
          MCPP_ARCHIVE: mcpp-0.0.109-macosx-arm64.tar.gz
          MCPP_ROOT: mcpp-0.0.109-macosx-arm64
        run: |
          curl -L -fsS -o "$MCPP_ARCHIVE" \
            "https://github.com/mcpp-community/mcpp/releases/download/v0.0.109/${MCPP_ARCHIVE}"
          tar -xzf "$MCPP_ARCHIVE"
          root="$PWD/$MCPP_ROOT"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$root/registry/bin/xlings" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: mcpp test (collect crash)
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          "$MCPP" --version
          "$MCPP" test -p boost-ext.ut || true
          bin=$(find tests/examples/boost-ext.ut/target -name 'ut' -type f | head -1)
          echo "BIN=$bin"
          echo "=== otool -L (static vs dylib) ==="
          otool -L "$bin" 2>/dev/null || true
      - name: build.ninja + macosx toolchain cfg
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          MCPPROOT="$PWD/mcpp-0.0.109-macosx-arm64"
          XP="$MCPPROOT/registry/data/xpkgs/xim-x-llvm/20.1.7"
          ninja_file=$(find tests/examples/boost-ext.ut/target -name "build.ninja" | head -1)
          echo "NINJA=$ninja_file"
          echo "=== build.ninja size ==="
          wc -l "$ninja_file" 2>/dev/null || true
          echo "=== link-related rules ==="
          grep -nE "rule |command =|libc\+\+|\.a |\.dylib|-o " "$ninja_file" 2>/dev/null | head -50 || true
          echo "=== build.ninja full (head 200) ==="
          head -200 "$ninja_file" 2>/dev/null || true
          echo "=== xpkg macosx section ==="
          grep -nA 40 '"macosx"\|macosx =' "$XP/.xpkg.lua" 2>/dev/null | head -60 || true
          echo "=== xpkg llvm compiler/link model section ==="
          grep -nB2 -A30 "link model\|link_rules\|toolchain\|compiler" "$XP/.xpkg.lua" 2>/dev/null | head -80 || true
