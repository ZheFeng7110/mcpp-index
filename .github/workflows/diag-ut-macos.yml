name: diag-ut-macos

on:
  push:
    branches: [fix-ut-macos-ci]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download mcpp 0.0.109
        shell: bash
        env:
          MCPP_ARCHIVE: mcpp-0.0.109-macosx-arm64.tar.gz
          MCPP_ROOT: mcpp-0.0.109-macosx-arm64
        run: |
          curl -L -fsS -o "$MCPP_ARCHIVE" \
            "https://github.com/mcpp-community/mcpp/releases/download/v0.0.109/${MCPP_ARCHIVE}"
          tar -xzf "$MCPP_ARCHIVE"
          root="$PWD/$MCPP_ROOT"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$root/registry/bin/xlings" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: mcpp test (collect crash)
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          "$MCPP" --version
          "$MCPP" test -p boost-ext.ut || true
          bin=$(find tests/examples/boost-ext.ut/target -name 'ut' -type f | head -1)
          echo "BIN=$bin"
          echo "=== otool -L (static vs dylib) ==="
          otool -L "$bin" 2>/dev/null || true
      - name: toolchain & link introspection
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          MCPPROOT="$PWD/mcpp-0.0.109-macosx-arm64"
          XP="$MCPPROOT/registry/data/xpkgs/xim-x-llvm/20.1.7"
          echo "=== .xpkg.lua (toolchain descriptor, full) ==="
          cat "$XP/.xpkg.lua" 2>/dev/null | head -300 || true
          echo "=== .mcpp-fixup.json ==="
          cat "$XP/.mcpp-fixup.json" 2>/dev/null || true
          echo "=== MCPP_LOG_LEVEL=debug: link command ==="
          MCPP_LOG_LEVEL=debug "$MCPP" test -p boost-ext.ut > /tmp/mcpp_dbg.log 2>&1 || true
          grep -niE "clang\+\+.*(-o |libc)|link|ld " /tmp/mcpp_dbg.log | grep -viE "\.md|\.txt|\.hpp|CMake|README|include/|\.lua" | head -25 || true
          echo "=== MCPP_LOG_LEVEL=trace attempt ==="
          MCPP_LOG_LEVEL=trace "$MCPP" test -p boost-ext.ut > /tmp/mcpp_trc.log 2>&1 || true
          grep -niE "clang\+\+.*(-o |\.a)" /tmp/mcpp_trc.log | head -25 || true
          echo "=== ninja/rsp files anywhere under member ==="
          find tests/examples/boost-ext.ut -type f \( -name "*.ninja" -o -name "*.rsp" -o -name "*.txt" \) 2>/dev/null | grep -viE "target/aarch64-macos/0fbb0b71bd39a150/(obj|bin)/" | head -20 || true
          ls -la tests/examples/boost-ext.ut/.mcpp/ 2>/dev/null | head -20 || true
          find tests/examples/boost-ext.ut/.mcpp -maxdepth 3 2>/dev/null | head -40 || true
