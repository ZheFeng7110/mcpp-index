name: diag-ut-macos

on:
  push:
    branches: [fix-ut-macos-ci]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download mcpp 0.0.109
        shell: bash
        env:
          MCPP_ARCHIVE: mcpp-0.0.109-macosx-arm64.tar.gz
          MCPP_ROOT: mcpp-0.0.109-macosx-arm64
        run: |
          curl -L -fsS -o "$MCPP_ARCHIVE" \
            "https://github.com/mcpp-community/mcpp/releases/download/v0.0.109/${MCPP_ARCHIVE}"
          tar -xzf "$MCPP_ARCHIVE"
          root="$PWD/$MCPP_ROOT"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$root/registry/bin/xlings" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: mcpp test (collect crash)
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          "$MCPP" --version
          "$MCPP" test -p boost-ext.ut || true
          bin=$(find tests/examples/boost-ext.ut/target -name 'ut' -type f | head -1)
          echo "BIN=$bin"
          echo "=== otool -L (static vs dylib) ==="
          otool -L "$bin" 2>/dev/null || true
      - name: toolchain & link introspection
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          echo "=== mcpp verbose: full log, link-related lines ==="
          "$MCPP" test -p boost-ext.ut -v > /tmp/mcpp_v.log 2>&1 || true
          grep -niE "link|ninja|clang\+\+|\.a\b|ld " /tmp/mcpp_v.log | grep -viE "\.md|\.txt|\.hpp|CMake|README|include/" | head -40 || echo "(none)"
          echo "=== mcpp -vv attempt ==="
          "$MCPP" test -p boost-ext.ut -vv > /tmp/mcpp_vv.log 2>&1 || true
          grep -niE "link|clang\+\+" /tmp/mcpp_vv.log | head -20 || echo "(none)"
          echo "=== registry layout ==="
          find "$HOME/.mcpp/registry" -maxdepth 2 -type d | head -25
          echo "=== registry config files (root-level) ==="
          find "$HOME/.mcpp/registry" -maxdepth 2 \( -name "*.lua" -o -name "*.toml" -o -name "*.json" \) | head -30
          echo "=== grep static/libc++/stdlib in registry configs ==="
          grep -rniE "static|libc\+\+|stdlib|dylib|runtime" "$HOME/.mcpp/registry" --include="*.lua" --include="*.toml" --include="*.json" 2>/dev/null | grep -vE "/xpkgs/.*/(include|lib|bin)/" | head -40 || echo "(none)"
          echo "=== xim-x-llvm pkg layout ==="
          ls "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/20.1.7/" 2>/dev/null | head -30
          echo "=== llvm toolchain descriptor ==="
          find "$HOME/.mcpp/registry" -name "*.lua" | xargs grep -ln "xim" 2>/dev/null | head -5
          echo "=== sandbox build files (ninja etc) ==="
          find tests/examples/boost-ext.ut -name "*.ninja" -o -name "build.ninja" -o -name "*.rsp" 2>/dev/null | head -10
          echo "=== .mcpp sandbox layout ==="
          find tests/examples/boost-ext.ut/.mcpp -maxdepth 2 2>/dev/null | head -30
          echo "=== clang link defaults (dry run) ==="
          clang=$(python3 -c "import json;print(json.load(open('tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'][0])")
          pkgroot=$(dirname $(dirname $clang))
          "$clang" -### -nostdinc++ -isystem "$pkgroot/include/c++/v1" --sysroot="$(xcrun --show-sdk-path)" -mmacosx-version-min=14.0 -o /tmp/x tests/examples/boost-ext.ut/target/aarch64-macos/*/obj/ut.o tests/examples/boost-ext.ut/target/aarch64-macos/*/obj/boost.ut.m.o 2>&1 | grep -oE '"-[A-Za-z0-9_.+-]+"' | sort -u | tr '\n' ' ' | head -c 2000
          echo ""
          echo "=== libc++ dylib vs archive resolution ==="
          ls -la "$pkgroot/lib/" | grep -iE "libc\+\+"
