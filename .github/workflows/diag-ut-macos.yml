name: diag-ut-macos

on:
  push:
    branches: [fix-ut-macos-ci]
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download mcpp 0.0.109
        shell: bash
        env:
          MCPP_ARCHIVE: mcpp-0.0.109-macosx-arm64.tar.gz
          MCPP_ROOT: mcpp-0.0.109-macosx-arm64
        run: |
          curl -L -fsS -o "$MCPP_ARCHIVE" \
            "https://github.com/mcpp-community/mcpp/releases/download/v0.0.109/${MCPP_ARCHIVE}"
          tar -xzf "$MCPP_ARCHIVE"
          root="$PWD/$MCPP_ROOT"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$root/registry/bin/xlings" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: mcpp test (collect crash)
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          "$MCPP" --version
          "$MCPP" test -p boost-ext.ut || true
          bin=$(find tests/examples/boost-ext.ut/target -name 'ut' -type f | head -1)
          echo "BIN=$bin"
          echo "=== otool -L (static vs dylib) ==="
          otool -L "$bin" 2>/dev/null || true
      - name: toolchain & link introspection
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          MCPPROOT="$PWD/mcpp-0.0.109-macosx-arm64"
          echo "=== downloaded mcpp registry layout ==="
          find "$MCPPROOT/registry" -maxdepth 2 2>/dev/null | head -30 || true
          echo "=== registry config files (lua/toml/json) ==="
          find "$MCPPROOT/registry" \( -name "*.lua" -o -name "*.toml" -o -name "*.json" \) 2>/dev/null | head -30 || true
          echo "=== grep static/libc++/stdlib/runtime in registry (non-xpkgs) ==="
          grep -rniE "static|libc\+\+|stdlib|dylib|runtime|toolchain" "$MCPPROOT/registry" --include="*.lua" --include="*.toml" --include="*.json" 2>/dev/null | grep -vE "/xpkgs/.*/(include|lib|bin|share)/" | head -40 || true
          echo "=== any toolchain spec near xpkgs ==="
          ls -la "$MCPPROOT/registry/data/xpkgs/" 2>/dev/null | head -10 || true
          ls -la "$MCPPROOT/registry/data/xpkgs/xim-x-llvm/20.1.7/" 2>/dev/null | head -30 || true
          find "$MCPPROOT/registry/data/xpkgs/xim-x-llvm/20.1.7/" -maxdepth 2 \( -name "*.lua" -o -name "*.toml" -o -name "*.json" -o -name "*.yaml" -o -name "*.yml" \) 2>/dev/null | head -10 || true
          echo "=== toolchain config content (if any) ==="
          for f in $(find "$MCPPROOT/registry" -maxdepth 3 \( -name "*.lua" -o -name "*.toml" \) 2>/dev/null | head -5); do echo "--- $f"; head -60 "$f" 2>/dev/null || true; done
          echo "=== clang link defaults (dry run) ==="
          clang=$(python3 -c "import json;print(json.load(open('tests/examples/boost-ext.ut/compile_commands.json'))[0]['arguments'][0])")
          pkgroot=$(dirname $(dirname $clang))
          "$clang" -### -nostdinc++ -isystem "$pkgroot/include/c++/v1" --sysroot="$(xcrun --show-sdk-path)" -mmacosx-version-min=14.0 -o /tmp/x tests/examples/boost-ext.ut/target/aarch64-macos/*/obj/ut.o tests/examples/boost-ext.ut/target/aarch64-macos/*/obj/boost.ut.m.o 2>&1 | tr '"' '\n' | grep -E "^\-" | sort -u | tr '\n' ' ' | head -c 2500 || true
          echo ""
          echo "=== libc++ libs in toolchain ==="
          ls -la "$pkgroot/lib/" 2>/dev/null | grep -iE "libc\+\+" || true
          echo "=== MCPP env knobs (strings in mcpp binary) ==="
          strings "$MCPPROOT/bin/mcpp" 2>/dev/null | grep -iE "^MCPP_[A-Z_]+$" | sort -u | head -30 || true
